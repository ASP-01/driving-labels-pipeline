[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labels-pipeline"
version = "0.1.0"
description = "PySpark + Elasticsearch pipeline for searchable driving-scene labels (Open Images)"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.5,<4",
  "pyarrow>=14",
  "pandas>=2",
  "tabulate>=0.9",
  "matplotlib>=3.8",
  "elasticsearch>=8,<9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
